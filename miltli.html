<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUMAN STEM se mudó</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://human-stem.github.io/page/miltli.html">
  <meta http-equiv="refresh" content="6;url=https://human-stem.github.io/page/miltli.html">
  <meta name="theme-color" content="#edf2e7">
  <link rel="icon" href="/HUMAN/assets/human-stem-isotipo.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --fondo: #edf2e7; --tinta: #1f2a1c; --acento: #2f5d3a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           background: var(--fondo); color: var(--tinta);
           font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 34rem; text-align: center; }
    img { width: 4.5rem; height: auto; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 1rem 0 .75rem; }
    p { margin: 0 0 1rem; }
    a.boton { display: inline-block; margin: .5rem 0 1.25rem; padding: .75rem 1.5rem; border-radius: 999px;
              background: var(--acento); color: #fff; text-decoration: none; font-weight: 600; }
    a.boton:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
    .url { font-size: .95rem; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <img src="/HUMAN/assets/human-stem-isotipo.svg" alt="HUMAN STEM">
    <h1>Este sitio ya no se actualiza</h1>
    <p>La página de HUMAN STEM ahora vive en una nueva dirección, con la información más reciente de Proyecto Superman y Programa Miltli.</p>
    <p aria-live="polite">Te llevaremos ahí en <strong id="s">6</strong> segundos.</p>
    <a class="boton" id="destino" href="https://human-stem.github.io/page/miltli.html">Ir al sitio nuevo</a>
    <p class="url">human-stem.github.io/page/miltli.html</p>
    <p>Gracias por visitarnos.</p>
  </main>
  <script>
    (function () {
      var destino = "https://human-stem.github.io/page/miltli.html";
      // Conserva #ancla y ?consulta del enlace original
      var url = destino + location.search + location.hash;
      document.getElementById("destino").href = url;
      var s = 6, el = document.getElementById("s");
      var t = setInterval(function () {
        s -= 1; if (el) el.textContent = s;
        if (s <= 0) { clearInterval(t); location.replace(url); }
      }, 1000);
    })();
  </script>
</body>
</html>
